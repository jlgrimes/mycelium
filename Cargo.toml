[workspace]
resolver = "2"
members = [
  "crates/mycelium-types",
  "crates/mycelium-core",
  "crates/mycelium-engine",
  "crates/mycelium-providers",
  "crates/mycelium-eval",
  "crates/mycelium-server",
  "adapters/openclaw",
]

[workspace.package]
edition = "2021"
license = "MIT"
version = "0.1.0"
authors = ["Jared Grimes"]

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
async-trait = "0.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
axum = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
